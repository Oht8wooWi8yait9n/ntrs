name: Update NTRS Sitemaps

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Sitemaps
        run: |
          python generate_ntrs_sitemap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A *.xml *.xml.gz sitemaps/ ntrs_*.txt ntrs_cache.json.gz
          if git diff --staged --quiet; then
            DAYS_SINCE_COMMIT=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
            if [ "$DAYS_SINCE_COMMIT" -ge 45 ]; then
              echo "No sitemap changes, but last commit was ${DAYS_SINCE_COMMIT} days ago (>= 45d). Pushing empty keepalive commit."
              git commit --allow-empty -m "chore(ci): 45-day keepalive to prevent GitHub Actions 60-day schedule auto-disable [skip ci]"
              git push
            else
              echo "No changes detected in sitemaps. (last commit ${DAYS_SINCE_COMMIT}d ago)."
            fi
          else
            git commit -m "Automated update of NTRS sitemaps [skip ci]"
            for attempt in $(seq 1 5); do
              echo "Push attempt $attempt of 5..."
              if git push; then
                echo "Successfully pushed updates."
                exit 0
              fi
              echo "Push failed, pulling with rebase and retrying in 5s..."
              sleep 5
              git pull --rebase origin main || true
            done
            echo "Failed to push after 5 attempts."
            exit 1
          fi
