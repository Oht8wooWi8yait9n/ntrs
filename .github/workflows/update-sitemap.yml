name: Update NTRS Sitemaps

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Sitemaps
        run: |
          python generate_ntrs_sitemap.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xml sitemaps/ ntrs_*.txt
          if git diff --staged --quiet; then
            echo "No changes detected in sitemaps."
          else
            git commit -m "Automated update of NTRS sitemaps [skip ci]"
            git push
          fi
